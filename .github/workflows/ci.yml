name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    # The app is a Windows tray program, so build and test it on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: PowerShell scripts parse (Windows PowerShell 5.1 and PowerShell 7)
        run: |
          $check = 'foreach ($f in "install.ps1","setup.ps1") { $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e); if ($e) { $e | Out-String | Write-Error; exit 1 } else { "$f ok" } }'
          powershell.exe -NoProfile -Command $check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -Command $check
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build (release flags)
        run: go build -trimpath -buildvcs=false -ldflags "-H=windowsgui -s -w" -o ClipboardTranslator.exe .
      - name: Check the exe carries its version info
        # The embedded icon itself is covered by TestAppIconIsEmbedded.
        shell: pwsh
        run: |
          $vi = (Get-Item .\ClipboardTranslator.exe).VersionInfo
          if ($vi.ProductName -ne 'Clipboard Translator') { throw "version info missing: $($vi.ProductName)" }
          "ok: $($vi.ProductName) $($vi.ProductVersion)"

  portable:
    # The non-Windows files only hold stubs, but they must keep compiling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
