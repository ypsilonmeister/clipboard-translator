name: Release

# Push a tag such as v0.5.0 to build the portable zip and attach it to a GitHub
# release. If a release for the tag already exists (for example one written by
# hand with its own notes), only the zip is uploaded to it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
      - run: go vet ./...
      - run: go test ./...
      - run: CT_TEST_MACOS=1 go test -tags mactest -run '^TestMacNative' -v -timeout 60s ./internal/platform
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: bash tools/package-macos.sh "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-app-${{ matrix.runner }}
          path: |
            dist/*macos*.zip
            dist/*macos*.sha256

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxtst-dev xvfb dbus-x11
      - run: go vet ./...
      - run: go test ./...
      - run: env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 CT_TEST_X11=1 xvfb-run -a go test -tags x11test -run '^TestX11' -timeout 60s ./internal/platform
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: bash tools/package-linux.sh "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-tarball
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: [linux, macos]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'

      - run: go vet ./...
      - run: go test ./...

      - name: Embed icon and version info
        run: go run ./tools/mksyso -version "${{ github.ref_name }}"

      - name: Build
        # main.version is what "Check for updates" compares against the latest release.
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          go build -trimpath -buildvcs=false -ldflags "-H=windowsgui -s -w -X main.version=$v" -o ClipboardTranslator.exe .

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $zip = "Portable-Clipboard-Translator-Windows-x64-$env:TAG.zip"
          $files = 'ClipboardTranslator.exe','Setup.cmd','Start.cmd','Stop.cmd','setup.ps1','config.json','README.txt','LICENSE'
          Compress-Archive -Path $files -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipSha = "$zip.sha256"
          "$hash  $zip" | Set-Content -LiteralPath $zipSha -Encoding ascii
          "ZIP=$zip" >> $env:GITHUB_ENV
          "ZIP_SHA=$zipSha" >> $env:GITHUB_ENV
          "SHA256=$hash" >> $env:GITHUB_ENV
          "$hash  $zip"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-tarball
          path: linux-dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: macos-app-*
          merge-multiple: true
          path: macos-dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ env.ZIP }}
            linux-dist/*.tar.gz
            macos-dist/*.zip

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ZIP $env:ZIP_SHA --clobber
          } else {
            $notes = "Portable Windows x64 build. See the README for setup.`n`nSHA-256 of the zip: ``$env:SHA256``"
            gh release create $env:TAG $env:ZIP $env:ZIP_SHA --title $env:TAG --notes $notes
          }

      - name: Attach Linux build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload $env:TAG (Get-ChildItem linux-dist -File).FullName --clobber

      - name: Attach macOS apps
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload $env:TAG (Get-ChildItem macos-dist -File).FullName --clobber

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: scoop-repo

      - name: Update Scoop manifest and open PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          url="https://github.com/${{ github.repository }}/releases/download/${TAG}/Portable-Clipboard-Translator-Windows-x64-${TAG}.zip"
          sha_asset="Portable-Clipboard-Translator-Windows-x64-${TAG}.zip.sha256"

          echo "Downloading $sha_asset from release $TAG..."
          mkdir -p scoop-download
          gh release download "$TAG" --pattern "$sha_asset" --dir scoop-download
          hash=$(awk '{print $1}' "scoop-download/$sha_asset")
          rm -rf scoop-download

          if [[ ! $hash =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Invalid SHA-256 hash: $hash" >&2
            exit 1
          fi

          cd scoop-repo
          git config core.autocrlf false

          echo "Updating bucket/clipboard-translator.json to version $version..."
          jq --indent 4 \
            --arg v "$version" \
            --arg u "$url" \
            --arg h "$(echo "$hash" | tr '[:upper:]' '[:lower:]')" \
            '.version = $v | .architecture["64bit"].url = $u | .architecture["64bit"].hash = $h' \
            bucket/clipboard-translator.json > bucket/clipboard-translator.json.tmp
          mv bucket/clipboard-translator.json.tmp bucket/clipboard-translator.json

          if git diff --quiet bucket/clipboard-translator.json; then
            echo "Scoop manifest is already up to date."
            exit 0
          fi

          branch="scoop-$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add bucket/clipboard-translator.json
          git commit -m "chore(scoop): bump to $version"
          git push origin "$branch" --force

          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "PR already exists for branch $branch."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(scoop): bump to $version" \
              --body "Automated Scoop manifest bump for release $TAG."
          fi
