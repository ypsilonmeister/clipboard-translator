name: Release

# Push a tag such as v0.5.0 to build the portable zip and attach it to a GitHub
# release. If a release for the tag already exists (for example one written by
# hand with its own notes), only the zip is uploaded to it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - run: CT_TEST_MACOS=1 go test -tags mactest -run '^TestMacNative' -v -timeout 60s ./internal/platform
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: bash tools/package-macos.sh "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ matrix.runner }}
          path: |
            dist/*macos*.zip
            dist/*macos*.sha256

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxtst-dev xvfb dbus-x11
      - run: go vet ./...
      - run: go test ./...
      - run: env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 CT_TEST_X11=1 xvfb-run -a go test -tags x11test -run '^TestX11' -timeout 60s ./internal/platform
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: bash tools/package-linux.sh "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: [linux, macos]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - run: go vet ./...
      - run: go test ./...

      - name: Embed icon and version info
        run: go run ./tools/mksyso -version "${{ github.ref_name }}"

      - name: Build
        # main.version is what "Check for updates" compares against the latest release.
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          go build -trimpath -buildvcs=false -ldflags "-H=windowsgui -s -w -X main.version=$v" -o ClipboardTranslator.exe .

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $zip = "Portable-Clipboard-Translator-Windows-x64-$env:TAG.zip"
          $files = 'ClipboardTranslator.exe','Setup.cmd','Start.cmd','Stop.cmd','setup.ps1','config.json','README.txt','LICENSE'
          Compress-Archive -Path $files -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "ZIP=$zip" >> $env:GITHUB_ENV
          "SHA256=$hash" >> $env:GITHUB_ENV
          "$hash  $zip"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ZIP --clobber
          } else {
            $notes = "Portable Windows x64 build. See the README for setup.`n`nSHA-256 of the zip: ``$env:SHA256``"
            gh release create $env:TAG $env:ZIP --title $env:TAG --notes $notes
          }
      - uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: linux-dist
      - name: Attach Linux build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload $env:TAG (Get-ChildItem linux-dist -File).FullName --clobber
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-app-*
          merge-multiple: true
          path: macos-dist
      - name: Attach macOS apps
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload $env:TAG (Get-ChildItem macos-dist -File).FullName --clobber
